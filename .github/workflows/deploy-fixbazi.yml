name: Deploy fixbazi to VPS

on:
  push:
    branches: [fixbazi-deploy]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        env:
          NEXT_PUBLIC_SITE_URL: https://fixbazi.ir
        run: npm ci --legacy-peer-deps && npm run build

      - name: Copy built app to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".next/standalone,.next/static,public,Dockerfile.prod,docker-compose.prod.yml,deploy"
          target: "/root/fixbazi"
          overwrite: true

      - name: Build and restart on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /root/fixbazi
            if [ ! -f .env ]; then
              printf 'NEXT_PUBLIC_SITE_URL=https://fixbazi.ir\n' > .env
            fi
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f
