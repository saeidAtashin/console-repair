name: Deploy fixbazi to VPS

on:
  push:
    branches: [fixbazi-deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/fixbazi
            git fetch origin fixbazi-deploy
            git checkout fixbazi-deploy
            git reset --hard origin/fixbazi-deploy
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f
