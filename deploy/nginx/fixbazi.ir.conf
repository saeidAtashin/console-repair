# nginx site config for fixbazi.ir
# Install: cp deploy/nginx/fixbazi.ir.conf /etc/nginx/sites-available/fixbazi.ir
# Enable:  ln -sf /etc/nginx/sites-available/fixbazi.ir /etc/nginx/sites-enabled/
# Test:    nginx -t && systemctl reload nginx
# SSL:     certbot --nginx -d fixbazi.ir -d www.fixbazi.ir

server {
    listen 80;
    listen [::]:80;
    server_name fixbazi.ir www.fixbazi.ir;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
