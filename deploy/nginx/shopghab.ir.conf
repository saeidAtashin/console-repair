# nginx site config for shopghab.ir
# Install: cp deploy/nginx/shopghab.ir.conf /etc/nginx/sites-available/shopghab.ir
# Enable:  ln -sf /etc/nginx/sites-available/shopghab.ir /etc/nginx/sites-enabled/
# Test:    nginx -t && systemctl reload nginx
# SSL:     certbot --nginx -d shopghab.ir -d www.shopghab.ir

server {
    listen 80;
    listen [::]:80;
    server_name shopghab.ir www.shopghab.ir;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
